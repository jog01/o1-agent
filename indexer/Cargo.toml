[package]
name = "indexer"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy = { version = "2.6.1", features = ["full"] }
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.9", features = ["derive", "env"] }
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1.19"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
